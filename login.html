{% extends "base.html" %}

{% block title %}Login — Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <!-- Login Card -->
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- Card Header with Gradient -->
            <div class="card-header bg-gradient-primary text-white text-center py-4">
                <div class="mb-2">
                    <i class="bi bi-box-arrow-in-right fs-1"></i>
                </div>
                <h3 class="mb-0 fw-bold">Welcome Back</h3>
                <p class="mb-0 opacity-75 small">Sign in to manage your tasks</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <!-- Login Form -->
                <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                    <!-- Username Field -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-person-fill text-muted"></i>
                            </span>
                            <input
                                type="text"
                                class="form-control form-control-lg"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                value="{{ username or '' }}"
                                required
                                autofocus
                            >
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-lock-fill text-muted"></i>
                            </span>
                            <input
                                type="password"
                                class="form-control form-control-lg"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >
                            <label class="form-check-label text-muted small" for="remember">
                                Remember me
                            </label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>

                <!-- Divider -->
                <div class="d-flex align-items-center my-4">
                    <hr class="flex-grow-1">
                    <span class="mx-3 text-muted small">or</span>
                    <hr class="flex-grow-1">
                </div>

                <!-- Register Link -->
                <div class="text-center">
                    <p class="mb-0 text-muted">
                        Don't have an account?
                        <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">
                            Create one
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
