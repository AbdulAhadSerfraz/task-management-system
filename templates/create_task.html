<!--
  ========================================
  Create Task Page
  ========================================
  Extends base.html and renders a form to create a new task.
  
  Fields:
    - title (text input, required)
    - description (textarea, optional)
  
  Validation:
    - Title is required (server-side check)
    - Empty/whitespace-only titles are rejected
  
  On success: redirects to dashboard with success message.
  On failure: shows error flash message and stays on form.
  ========================================
-->
{% extends "base.html" %}
{% block title %}Create Task{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Create New Task</h4>
            </div>
            <div class="card-body">
                <!-- Task creation form (POST to same URL) -->
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="priority" class="form-label">Priority</label>
                        <select class="form-select" id="priority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <input type="text" class="form-control" id="category" name="category" placeholder="e.g., Work, Personal">
                    </div>
                    <div class="mb-3">
                        <label for="due_date" class="form-label">Due Date</label>
                        <input type="date" class="form-control" id="due_date" name="due_date">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create Task</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
